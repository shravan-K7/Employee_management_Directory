<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: blue;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Add Employee</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Add Employee</button>
    </form>

    <a href="{% url 'home' %}">Back to Home</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>
</head>
<body>

<h1>Employee Dashboard</h1>

<a href="{% url 'add' %}">Add Employee</a>
<br><br>

<table border="2" style="border-collapse: collapse;">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Joining Date</th>
        <th>Actions</th>
    </tr>

    {% for emp in employees %}
    <tr>
        <td>{{ emp.name }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.department }}</td>
        <td>{{ emp.salary }}</td>
        <td>{{ emp.joining_date }}</td>
        <td>
            <a href="{% url 'edit' emp.id %}" style="padding: 10px;">Edit</a>

            <form action="{% url 'delete' emp.id %}" method="POST"
                  style="display:inline; padding: 10px;">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="6">No employees found.</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
